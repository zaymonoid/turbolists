name: Kitbag
options:
  bundleIdPrefix: com.kitbag
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  KitbagCore:
    path: ../KitbagCore
  ObservableStore:
    url: https://github.com/subconsciousnetwork/ObservableStore
    exactVersion: 0.6.1
targets:
  Kitbag:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: KitbagCore
        product: KitbagCore
      - package: ObservableStore
        product: ObservableStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kitbag.swiftui
        PRODUCT_NAME: Kitbag
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kitbag
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KitbagTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Kitbag
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kitbag.swiftui.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kitbag:
    build:
      targets:
        Kitbag: all
    test:
      targets:
        - KitbagTests
